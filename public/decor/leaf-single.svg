<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" fill="none">
  <defs>
    <linearGradient id="kb-decor-single-leaf" x1="15" y1="12" x2="88" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BDED9B"/>
      <stop offset="42%" stop-color="#56A050"/>
      <stop offset="80%" stop-color="#286931"/>
      <stop offset="100%" stop-color="#15421C"/>
    </linearGradient>
    <linearGradient id="kb-decor-single-stem" x1="48" y1="68" x2="57" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4E8A43"/>
      <stop offset="100%" stop-color="#9A6B32"/>
    </linearGradient>
    <filter id="kb-decor-single-shadow" x="-20%" y="-15%" width="150%" height="150%">
      <feDropShadow dx="1" dy="4" stdDeviation="3.5" flood-color="#143B1D" flood-opacity="0.22"/>
