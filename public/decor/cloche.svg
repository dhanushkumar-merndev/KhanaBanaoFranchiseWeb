<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" fill="none">
  <defs>
    <linearGradient id="kb-decor-cloche-gold" x1="20" y1="20" x2="240" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0C7"/>
      <stop offset="25%" stop-color="#F1D69A"/>
      <stop offset="55%" stop-color="#C9A24D"/>
      <stop offset="85%" stop-color="#9D6F2A"/>
      <stop offset="100%" stop-color="#6E4A19"/>
    </linearGradient>
    <linearGradient id="kb-decor-cloche-rim" x1="15" y1="151" x2="245" y2="151" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9D6F2A"/>
      <stop offset="20%" stop-color="#FFF0C7"/>
      <stop offset="50%" stop-color="#C9A24D"/>
      <stop offset="80%" stop-color="#FFF0C7"/>
      <stop offset="100%" stop-color="#6E4A19"/>
    </linearGradient>
    <radialGradient id="kb-decor-cloche-ruby" cx="0" cy="0" r="1" gradientTransform="translate(130 30) scale(12 12)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="60%" stop-color="#C1272D"/>
      <stop offset="100%" stop-color="#610A0E"/>
    </radialGradient>
    <filter id="kb-decor-cloche-glow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="4.5" flood-color="#5B3A13" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#kb-decor-cloche-glow)">
    <!-- Base Plate Rim -->
    <path d="M17 151h226" stroke="url(#kb-decor-cloche-rim)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M28 156h204" stroke="url(#kb-decor-cloche-rim)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

    <!-- Main Cloche Dome -->
    <path d="M31 150c0-53 44-96 99-96s99 43 99 96" stroke="url(#kb-decor-cloche-gold)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dome Metallic Highlights & Shading Lines -->
    <path d="M46 137c6-35 29-62 60-73" stroke="#FFF5DA" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M214 137c-4-25-18-48-38-62" stroke="#855B1F" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
    <path d="M70 132h120" stroke="url(#kb-decor-cloche-gold)" stroke-width="1.5" stroke-dasharray="2 8" opacity="0.6"/>

    <!-- Decorative Engraved Band -->
    <path d="M102 95c8-8 18-11 28-11s20 3 28 11M111 108c12 5 26 5 38 0" stroke="url(#kb-decor-cloche-gold)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Handle Neck & Top Ruby Gem Knob -->
    <path d="M130 54V38" stroke="url(#kb-decor-cloche-gold)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M112 38c0-10 8-18 18-18s18 8 18 18h-36Z" fill="none" stroke="url(#kb-decor-cloche-gold)" stroke-width="3.2" stroke-linejoin="round"/>
    <circle cx="130" cy="30" r="7" fill="url(#kb-decor-cloche-ruby)"/>
    <circle cx="128" cy="28" r="2" fill="#FFFFFF" opacity="0.8"/>

    <!-- Center Emblem Accent -->
    <path d="m126 93 4-6 4 6-4 6-4-6Z" fill="#C1272D"/>

    <!-- Delicate Steam Whimsical Curves -->
    <path d="M105 18c-4-8 2-12-2-16M130 16c-3-6 3-10-1-14M155 18c-4-8 2-12-2-16" stroke="#C9A24D" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  </g>
</svg>
