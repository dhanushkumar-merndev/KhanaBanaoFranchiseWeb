<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 110" fill="none">
  <defs>
    <linearGradient id="kb-decor-chilli-body" x1="18" y1="15" x2="75" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B59"/>
      <stop offset="35%" stop-color="#E52D2E"/>
      <stop offset="70%" stop-color="#B8141F"/>
      <stop offset="100%" stop-color="#7A0810"/>
    </linearGradient>
    <linearGradient id="kb-decor-chilli-stem" x1="36" y1="5" x2="62" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B9A44"/>
      <stop offset="60%" stop-color="#346824"/>
      <stop offset="100%" stop-color="#1E4213"/>
    </linearGradient>
    <filter id="kb-decor-chilli-shadow" x="-25%" y="-15%" width="160%" height="145%">
      <feDropShadow dx="2" dy="5" stdDeviation="3.5" flood-color="#520A10" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#kb-decor-chilli-shadow)">
    <!-- Main Chilli Body -->
    <path d="M37 22c12 0 25 7 29 18 8 23-9 48-44 63 13-15 14-27 8-41-8-18-4-34 7-40Z" fill="url(#kb-decor-chilli-body)"/>

    <!-- High-Gloss Specular Reflection -->
