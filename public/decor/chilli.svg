    <path d="M43 32c5 1 10 5 12 10" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

    <!-- Green Stem / Calyx Base -->
    <path d="M37 23c-1-9 2-16 11-20 1 8 7 12 15 13-5 7-14 9-26 7Z" fill="url(#kb-decor-chilli-stem)"/>
    <!-- Stem Top Hook -->
    <path d="M43 18c2-5 5-9 9-12" stroke="#78B35D" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Calyx Highlights & Vein Details -->
